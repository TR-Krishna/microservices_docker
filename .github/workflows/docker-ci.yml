name:CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
   runs-on: ubuntu-latest

   steps:
    - name:Checkout code
      uses: actions/checkout@v2

    - name:Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

   - name:Build and push Meter API
      uses: docker/build-push-action@v2
      with:
        context: ./DemoApi2
        push: true
        tags: ghcr.io/tr-krishna/meterapi:latest

   - name: Build and push Order API 
      uses: docker/build-push-action@v2
      with:
        context: ./DemoOrder
        push :true
        tags:ghcr.io/tr-krishna/orderapi:latest
  